# Run ONLY as a private service. clamd TCP is unauthenticated and unencrypted.
Foreground yes
User clamav
DatabaseDirectory /var/lib/clamav
LocalSocket /tmp/clamd.sock
LocalSocketMode 660
FixStaleSocket yes
TCPSocket 3310
TCPAddr 0.0.0.0
LogTime yes
LogClean no
LogVerbose no
ExtendedDetectionInfo no
GenerateMetadataJson no
LeaveTemporaryFiles no
StreamMaxLength 32M
MaxFileSize 32M
MaxScanSize 100M
MaxFiles 10000
MaxRecursion 16
MaxScanTime 10000
MaxThreads 2
MaxQueue 8
ReadTimeout 15
CommandReadTimeout 5
SelfCheck 300
ConcurrentDatabaseReload no
ScanArchive yes
AlertExceedsMax yes
AlertEncrypted yes
AlertOLE2Macros yes
